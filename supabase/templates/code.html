<html lang="en-NZ">

      <tr>
        <td style="padding:28px 28px 8px;font-size:18px;font-weight:bold">{{ .Data.company_name }} Workshop</td>

      <tr>
        <td style="padding:12px 28px 20px;font-size:34px;letter-spacing:8px;font-weight:bold">{{ .Token }}</td>

      <tr>
        <td style="padding:0 28px 28px;font-size:13px;color:#6b7280">It expires in 15 minutes. If you didn't ask for it, ignore this email.</td>
